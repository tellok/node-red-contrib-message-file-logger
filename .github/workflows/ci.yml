name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  package:
    runs-on:
    - self-hosted
    - tower
    - ubuntu-latest
    - tower-run-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.14.0'
        cache: npm

    - name: Setup npm with trusted publishing support
      run: npm install -g npm@11.5.1

    - name: Install dependencies
      run: npm ci

    - name: Check npm package
      run: npm run pack:check
